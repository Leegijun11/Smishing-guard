<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 기반 스미싱 문자 판별</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="app">

    <header class="app__header">
      <h1>스미싱 문자 판별</h1>
      <p>
        문자 내용을 입력하면 AI가 스미싱 여부를 분석하고
        의심되는 이유와 대처 방법을 안내합니다.
      </p>
    </header>

    <main>

      <section class="panel">

        <label for="smsText" class="panel__label">
          문자 내용
        </label>

        <textarea
          id="smsText"
          class="panel__textarea"
          placeholder="예시)

[Web발신]
고객님의 택배가 주소지 불명으로 보관 중입니다.
아래 링크에서 배송 정보를 확인해 주세요.
http://example.com"
        ></textarea>

        <button
          id="analyzeBtn"
          class="panel__button">
          분석하기
        </button>

        <p
          id="errorMsg"
          class="panel__error"
          hidden>
        </p>

      </section>


      <section
        id="loading"
        class="loading"
        hidden>

        <div class="loading__spinner"></div>

        <p>
          문자를 분석하는 중입니다.<br>
          잠시만 기다려 주세요.
        </p>

      </section>


      <section
        id="resultSection"
        class="result"
        hidden>

        <div
          id="verdictBadge"
          class="result__badge">
          분석 결과
        </div>

        <div class="result__block">
          <h2>분석 결과</h2>
          <p id="summaryText"></p>
        </div>

        <div class="result__block">
          <h2>스미싱 유형</h2>
          <p id="scamTypeText"></p>
        </div>

        <div class="result__block">
          <h2>판단 근거</h2>
          <ul id="reasonsList"></ul>
        </div>

        <div class="result__block">
          <h2>대처 방법</h2>
          <ol id="actionGuideList"></ol>
        </div>

        <div class="result__block">
          <h2>예측 확률</h2>
          <div id="bertBars" class="bars"></div>
        </div>

      </section>

    </main>


    <footer class="app__footer">
      <span id="healthStatus">
        서버 연결 상태 확인 중...
      </span>
    </footer>

  </div>

  <script src="app.js"></script>

</body>

</html>
