<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smishing Guard - 스미싱 문자 판별</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app__header">
      <h1>📱 Smishing Guard</h1>
      <p>의심스러운 문자 메시지를 붙여넣으면 BERT 분류와 AI 분석으로 사기 여부와 대처법을 알려드립니다.</p>
    </header>

    <main class="app__main">
      <section class="panel">
        <label for="smsText" class="panel__label">문자 메시지 원문</label>
        <textarea
          id="smsText"
          class="panel__textarea"
          rows="6"
          placeholder="예) [Web발신] CJ대한통운 고객님의 택배가 주소지 불명으로 보관중입니다. 주소 재확인 http://..."
        ></textarea>
        <button id="analyzeBtn" class="panel__button">분석하기</button>
        <p id="errorMsg" class="panel__error" hidden></p>
      </section>

      <section id="resultSection" class="result" hidden>
        <div id="verdictBadge" class="result__badge">판단중</div>

        <div class="result__block">
          <h2>요약</h2>
          <p id="summaryText"></p>
        </div>

        <div class="result__block">
          <h2>유형</h2>
          <p id="scamTypeText"></p>
        </div>

        <div class="result__block">
          <h2>판단 근거</h2>
          <ul id="reasonsList"></ul>
        </div>

        <div class="result__block">
          <h2>다음 행동 가이드라인</h2>
          <ol id="actionGuideList"></ol>
        </div>

        <div class="result__block">
          <h2>BERT 분류 상위 후보</h2>
          <div id="bertBars" class="bars"></div>
        </div>
      </section>

      <section id="loading" class="loading" hidden>
        <div class="loading__spinner"></div>
        <p>AI가 문자를 분석하고 있습니다...</p>
      </section>
    </main>

    <footer class="app__footer">
      <span id="healthStatus">백엔드 상태 확인 중...</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
